image:
  repository: vllm/vllm-omni
  tag: "v0.24.0"
  pullPolicy: IfNotPresent
nginx:
  image: nginx:alpine
replicaCount: 1

workloads:
  aimqwen3ttsvllm:
    replicaCount: 1

revisionHistoryLimit: 1
apiPort: 8000
dashboardPort: 8080
strategy:
  type: Recreate
resources:
  limits:
    cpu: "8"
    memory: 16Gi
    nvidia.com/gpu: "1"
  requests:
    cpu: "2"
    memory: 8Gi
nginxResources:
  limits:
    cpu: 200m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi
env:
  MODEL_NAME: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  MODEL_ALIAS: qwen3-tts
  HF_HOME: /models/huggingface
  VLLM_OMNI_GPU_UTIL: "0.9"
volumes:
  dshm:
    sizeLimit: 2Gi
startupProbe:
  httpGet:
    path: /health
    port: 8000
  failureThreshold: 80
  periodSeconds: 15
  timeoutSeconds: 5
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 15
  failureThreshold: 5
userspace:
  appData: /olares/rootfs/userspace/pvc-userspace-aimighty-phbiddku99qy4cuz
service:
  type: ClusterIP
