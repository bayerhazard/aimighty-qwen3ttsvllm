---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimqwen3ttsvllm-dashboard
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    events { worker_connections 64; }
    http {
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
      access_log /dev/stdout main;
      error_log /dev/stderr warn;
      sendfile on;
      tcp_nopush on;
      keepalive_timeout 65;
      gzip on;
      gzip_types text/html text/css application/javascript;

      upstream tts_api {
        server 127.0.0.1:{{ .Values.apiPort }};
      }

      server {
        listen {{ .Values.dashboardPort }};
        server_name _;

        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $uri $uri/ /index.html;
        }

        location /v1/ {
          proxy_pass http://tts_api;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
          proxy_connect_timeout 30s;
        }

        location /health {
          proxy_pass http://tts_api;
          proxy_set_header Host $host;
        }
      }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Qwen3-TTS</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #0f0f0f; color: #e0e0e0; min-height: 100vh;
          display: flex; align-items: center; justify-content: center;
        }
        .container { width: 100%; max-width: 680px; padding: 2rem; }
        h1 {
          font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem;
          background: linear-gradient(135deg, #64748b, #3b82f6);
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 1.5rem; }
        textarea {
          width: 100%; height: 110px; padding: 0.75rem; border-radius: 8px;
          border: 1px solid #333; background: #1a1a1a; color: #e0e0e0;
          font-size: 0.95rem; resize: vertical; outline: none;
          transition: border-color 0.2s;
        }
        textarea:focus { border-color: #3b82f6; }
        .controls { display: flex; gap: 0.75rem; margin-top: 1rem; align-items: center; }
        select {
          flex: 1; padding: 0.6rem 0.75rem; border-radius: 8px;
          border: 1px solid #333; background: #1a1a1a; color: #e0e0e0;
          font-size: 0.9rem; outline: none; cursor: pointer;
        }
        select:focus { border-color: #3b82f6; }
        .instruct {
          width: 100%; margin-top: 0.75rem; padding: 0.6rem 0.75rem;
          border-radius: 8px; border: 1px solid #333; background: #1a1a1a;
          color: #e0e0e0; font-size: 0.9rem; outline: none;
        }
        .instruct:focus { border-color: #3b82f6; }
        button {
          padding: 0.6rem 1.5rem; border-radius: 8px; border: none;
          background: linear-gradient(135deg, #64748b, #3b82f6);
          color: #fff; font-size: 0.9rem; font-weight: 500;
          cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 1rem; font-size: 0.85rem; color: #888; min-height: 1.5rem; }
        .status.error { color: #ef4444; }
        .status.success { color: #22c55e; }
        audio { width: 100%; margin-top: 1rem; border-radius: 8px; }
        .health {
          margin-top: 2rem; padding: 0.75rem; border-radius: 8px;
          background: #1a1a1a; border: 1px solid #333; font-size: 0.8rem; color: #888;
        }
        .health span { color: #22c55e; }
        .hint { color: #666; font-size: 0.78rem; margin-top: 0.4rem; }
      </style>
    </head>
    <body>
      <div class="container">
        <h1>Qwen3-TTS 1.7B</h1>
        <p class="subtitle">Alibaba Qwen3-TTS-12Hz via vLLM-Omni — 10 languages, instruction control</p>

        <textarea id="textInput" placeholder="Enter text to synthesize...">Guten Tag! Ich bin Qwen3-TTS, ein mehrsprachiges Text-to-Speech Modell von Alibaba.</textarea>

        <div class="controls">
          <select id="voiceSelect">
            <option value="vivian">Vivian — bright young female (ZH)</option>
            <option value="serena">Serena — warm gentle female (ZH)</option>
            <option value="uncle_fu">Uncle Fu — low mellow male (ZH)</option>
            <option value="dylan">Dylan — Beijing male (ZH)</option>
            <option value="eric">Eric — Sichuan male (ZH)</option>
            <option value="ryan">Ryan — dynamic male (EN)</option>
            <option value="aiden">Aiden — sunny American male (EN)</option>
            <option value="ono_anna">Ono Anna — playful female (JA)</option>
            <option value="sohee">Sohee — warm female (KO)</option>
          </select>
          <select id="langSelect">
            <option value="Auto">Auto</option>
            <option value="Chinese">中文</option>
            <option value="English">English</option>
            <option value="German" selected>Deutsch</option>
            <option value="Japanese">日本語</option>
            <option value="Korean">한국어</option>
            <option value="French">Français</option>
            <option value="Russian">Русский</option>
            <option value="Portuguese">Português</option>
            <option value="Spanish">Español</option>
            <option value="Italian">Italiano</option>
          </select>
        </div>

        <input class="instruct" id="instructInput" placeholder="Optional: style instructions (e.g. 'Sprich sehr fröhlich und schnell')">

        <div class="controls">
          <button id="generateBtn" onclick="generateSpeech()">Generate</button>
        </div>
        <div class="hint">Tip: the speaker above picks the timbre; the instruction field steers emotion, speed and tone.</div>

        <div class="status" id="status"></div>
        <div id="audioContainer"></div>

        <div class="health" id="healthInfo">Checking health...</div>
      </div>
      <script>
        const statusEl = document.getElementById('status');
        const audioContainer = document.getElementById('audioContainer');

        async function checkHealth() {
          try {
            const res = await fetch('/health');
            await res.json();
            document.getElementById('healthInfo').innerHTML = 'Status: <span>OK</span>';
          } catch (e) {
            document.getElementById('healthInfo').innerHTML = 'Status: <span style="color:#ef4444">UNREACHABLE</span>';
          }
        }

        async function generateSpeech() {
          const text = document.getElementById('textInput').value.trim();
          const voice = document.getElementById('voiceSelect').value;
          const language = document.getElementById('langSelect').value;
          const instructions = document.getElementById('instructInput').value.trim();
          const btn = document.getElementById('generateBtn');

          if (!text) { statusEl.className = 'status error'; statusEl.textContent = 'Please enter some text.'; return; }

          btn.disabled = true;
          statusEl.className = 'status';
          statusEl.textContent = 'Generating...';
          audioContainer.innerHTML = '';

          const payload = { model: 'qwen3-tts', input: text, voice: voice };
          if (language && language !== 'Auto') payload.language = language;
          if (instructions) payload.instructions = instructions;

          try {
            const res = await fetch('/v1/audio/speech', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.detail || `HTTP ${res.status}`);
            }

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);
            audioContainer.innerHTML = '<audio controls autoplay src="' + url + '"></audio>';
            statusEl.className = 'status success';
            statusEl.textContent = 'Done! (' + (blob.size / 1024).toFixed(0) + ' KB)';
          } catch (e) {
            statusEl.className = 'status error';
            statusEl.textContent = 'Error: ' + e.message;
          } finally {
            btn.disabled = false;
          }
        }

        checkHealth();
        setInterval(checkHealth, 30000);
      </script>
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aimqwen3ttsvllm-env
  namespace: {{ .Release.Namespace }}
data:
  MODEL_NAME: {{ .Values.env.MODEL_NAME | quote }}
  MODEL_ALIAS: {{ .Values.env.MODEL_ALIAS | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimqwen3ttsvllm
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimqwen3ttsvllm
    applications.app.bytetrade.io/name: aimqwen3ttsvllm
    applications.app.bytetrade.io/owner: {{ .Release.Namespace | trimSuffix "-aimighty" }}
    applications.app.bytetrade.io/raw-app-name: aimqwen3ttsvllm
spec:
  replicas: {{ .Values.workloads.aimqwen3ttsvllm.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: aimqwen3ttsvllm
  strategy:
    type: {{ .Values.strategy.type }}
  template:
    metadata:
      labels:
        app: aimqwen3ttsvllm
        applications.app.bytetrade.io/name: aimqwen3ttsvllm
        applications.app.bytetrade.io/owner: {{ .Release.Namespace | trimSuffix "-aimighty" }}
        applications.app.bytetrade.io/raw-app-name: aimqwen3ttsvllm
        io.bytetrade.app: "true"
    spec:
      containers:
      # Container 1: vLLM-Omni TTS API
      - name: vllm-server
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["vllm-omni", "serve"]
        args:
          - "$(MODEL_NAME)"
          - "--served-model-name"
          - "$(MODEL_ALIAS)"
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
          - "--gpu-memory-utilization"
          - "$(VLLM_OMNI_GPU_UTIL)"
          - "--trust-remote-code"
          - "--omni"
        env:
          - name: HF_HOME
            value: {{ .Values.env.HF_HOME | quote }}
          - name: VLLM_OMNI_GPU_UTIL
            value: {{ .Values.env.VLLM_OMNI_GPU_UTIL | quote }}
          - name: PYTORCH_CUDA_ALLOC_CONF
            value: "expandable_segments:True"
          - name: GPU_TYPE
            value: "nvidia"
        envFrom:
          - configMapRef:
              name: aimqwen3ttsvllm-env
        ports:
          - containerPort: {{ .Values.apiPort }}
            name: api
        resources:
            {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
          - name: models
            mountPath: /models
          - name: dshm
            mountPath: /dev/shm
        startupProbe:
            {{- toYaml .Values.startupProbe | nindent 10 }}
        livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 10 }}

      # Container 2: nginx Dashboard
      - name: nginx
        image: "{{ .Values.nginx.image }}"
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: {{ .Values.dashboardPort }}
            name: dashboard
        resources:
            {{- toYaml .Values.nginxResources | nindent 10 }}
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/nginx.conf
            subPath: nginx.conf
          - name: dashboard-html
            mountPath: /usr/share/nginx/html

      volumes:
        - name: models
          hostPath:
            path: {{ .Values.userspace.appData }}/models
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.volumes.dshm.sizeLimit }}
        - name: nginx-config
          configMap:
            name: aimqwen3ttsvllm-dashboard
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: dashboard-html
          configMap:
            name: aimqwen3ttsvllm-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: aimqwen3ttsvllm
  namespace: {{ .Release.Namespace }}
  labels:
    app: aimqwen3ttsvllm
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: dashboard
      port: {{ .Values.dashboardPort }}
      targetPort: {{ .Values.dashboardPort }}
      protocol: TCP
    - name: api
      port: {{ .Values.apiPort }}
      targetPort: {{ .Values.apiPort }}
      protocol: TCP
  selector:
    app: aimqwen3ttsvllm
