olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  aimqwen3ttsvllm: 1

metadata:
  name: aimqwen3ttsvllm
  icon: https://raw.githubusercontent.com/bayerhazard/aimighty-qwen3ttsvllm/main/icon.png
  description: Qwen3-TTS-12Hz-1.7B via vLLM-Omni — OpenAI-compatible /v1/audio/speech, 10 languages
  appid: aimqwen3ttsvllm
  title: AIM Qwen3 TTS 1.7B
  version: '1.0.0'
  categories:
    - Audio

entrances:
  - name: aimqwen3ttsvllm
    port: 8080
    host: aimqwen3ttsvllm
